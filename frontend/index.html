<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KarigarSetu · From the maker's bench to your shop shelf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#FBF6EE; --paper:#FFFDF9; --tan:#C8874A; --tan-d:#9A5B26; --brown:#3B2416; --ink:#2A1C12;
  --muted:#7A6555; --line:#EADFCF; --green:#2F7D4F; --green-bg:#E5F3EA; --amber:#9A6200; --amber-bg:#FCF0D6;
  --blue:#2B5C9A; --blue-bg:#E4EEF9; --red:#A23A2C; --red-bg:#F9E4E0; --gray-bg:#F1ECE4;
  --wa:#1F9D55;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--cream);color:var(--ink);line-height:1.55;font-size:16px}
h1,h2,h3{font-family:'Fraunces',Georgia,serif;font-weight:700;color:var(--brown);margin:0 0 .5em;line-height:1.15}
a{color:var(--tan-d)}
button{font:inherit;cursor:pointer}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--brown);background:transparent;color:var(--brown);padding:10px 18px;border-radius:999px;font-weight:500;text-decoration:none;font-size:15px}
.btn:hover{background:var(--gray-bg)}
.btn.primary{background:var(--brown);color:var(--cream)}
.btn.primary:hover{background:#563522}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn.wa:hover{background:#178246}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn.ok{background:var(--green);border-color:var(--green);color:#fff}

/* header */
header.site{position:sticky;top:0;z-index:5;background:rgba(251,246,238,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
header.site .wrap{display:flex;align-items:center;justify-content:space-between;height:64px;gap:12px}
.logo{display:flex;align-items:center;gap:10px;font-family:'Fraunces',serif;font-weight:700;font-size:21px;color:var(--brown);text-decoration:none}
.logo span{color:var(--tan-d)}
nav.main{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
nav.main a{padding:8px 12px;border-radius:999px;text-decoration:none;color:var(--brown);font-size:15px}
nav.main a.active{background:var(--gray-bg)}
nav.main a.login{border:1px solid var(--brown);margin-left:6px}

/* home */
.hero{padding:72px 0 56px}
.hero .wrap{display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center}
.eyebrow{display:inline-block;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--tan-d);font-weight:700;margin-bottom:14px}
.hero h1{font-size:clamp(34px,5vw,54px)}
.hero p.lead{font-size:19px;color:var(--muted);max-width:520px;margin:0 0 26px}
.hero-art{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:28px;position:relative}
.chat-mini{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.bub{font-size:14px;padding:8px 12px;border-radius:14px;max-width:85%}
.bub.r{background:#DCF5E3;align-self:flex-end;color:#16462A}
.bub.b{background:var(--gray-bg);color:var(--ink)}
section.block{padding:56px 0}
section.alt{background:var(--paper);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:26px}
.step{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:22px}
section.alt .step{background:var(--cream)}
.step .n{width:34px;height:34px;border-radius:50%;background:var(--brown);color:var(--cream);display:grid;place-items:center;font-weight:700;margin-bottom:12px}
.step h3{font-size:20px}
.step p{margin:0;color:var(--muted)}
.makers{display:grid;grid-template-columns:repeat(2,1fr);gap:22px;margin-top:26px}
.maker{background:var(--paper);border:1px solid var(--line);border-radius:22px;overflow:hidden;display:flex;flex-direction:column}
.maker .ph{height:150px;display:grid;place-items:center}
.maker .body{padding:20px 22px 22px;display:flex;flex-direction:column;gap:10px;flex:1}
.maker h3{font-size:23px;margin:0}
.meta{color:var(--muted);font-size:14px;display:flex;gap:14px;flex-wrap:wrap}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12.5px;background:var(--gray-bg);padding:4px 10px;border-radius:999px;color:var(--brown)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 6px}
.fact{background:var(--cream);border-radius:12px;padding:8px 10px}
.fact b{display:block;font-size:16px;color:var(--brown)}
.fact small{color:var(--muted);font-size:12px}
.designs{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:26px}
.design{background:var(--cream);border:1px solid var(--line);border-radius:18px;padding:18px;text-align:center}
.design h3{font-size:19px;margin:8px 0 2px}
.design p{margin:0;color:var(--muted);font-size:14px}
footer.site{padding:36px 0;color:var(--muted);font-size:14px}
footer.site .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

/* about / contact */
.page{padding:56px 0}
.prose{max-width:720px}
.prose p{font-size:17px;color:#4A382B}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:24px}
label{display:block;font-size:14px;font-weight:500;margin:0 0 6px;color:var(--brown)}
input,select,textarea{font:inherit;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--tan);outline-offset:1px}
.field{margin-bottom:14px}
.note{font-size:13px;color:var(--muted)}
.okmsg{background:var(--green-bg);color:var(--green);padding:10px 12px;border-radius:10px;font-size:14px;margin-top:10px}
.err{color:var(--red);font-size:13px;margin-top:6px}

.about-hero{padding:56px 0 40px}
.about-hero h1{font-size:clamp(34px,5vw,56px);max-width:820px}
.about-hero .lead{font-size:19px;color:var(--muted);max-width:680px;margin:0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:22px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px}
.stat b{display:block;font-family:'Fraunces',serif;font-size:30px;color:var(--tan-d)}
.stat span{font-size:14px;color:var(--muted)}
.gap{background:var(--cream);border:1px solid var(--line);border-radius:20px;padding:22px}
.gap-row{margin-bottom:18px}
.gap-row small{display:block;color:var(--muted);font-size:13px}
.gap-row b{display:block;font-family:'Fraunces',serif;font-size:30px;color:var(--brown)}
.bar{height:12px;border-radius:6px;background:var(--brown);margin-top:6px;min-width:6px}
.bar.low{background:var(--tan)}
.timeline{list-style:none;margin:24px 0 0;padding:0;border-left:2px solid var(--line)}
.timeline li{display:grid;grid-template-columns:130px 1fr;gap:16px;padding:0 0 22px 22px;position:relative}
.timeline li::before{content:'';position:absolute;left:-7px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--tan)}
.timeline time{font-weight:700;color:var(--tan-d);font-size:15px}
.timeline h3{font-size:19px;margin:0 0 2px}
.timeline p{margin:0;color:var(--muted)}
.probs{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:22px}
.prob{background:var(--cream);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column}
.pn{width:32px;height:32px;border-radius:50%;background:var(--brown);color:var(--cream);display:grid;place-items:center;font-weight:700}
.prob h3{font-size:19px;margin:10px 0 6px}
.prob p{margin:0 0 14px;color:#4A382B;font-size:15px;flex:1}
.fix{font-size:14px;background:var(--green-bg);color:var(--green);border-radius:10px;padding:8px 10px}
.sources{margin:0;padding-left:18px;font-size:14px;color:var(--muted)}
.sources li{margin-bottom:6px}
.about-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.ph-slot{aspect-ratio:4/3;border-radius:20px;border:2px dashed var(--line);background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;color:var(--brown);font-weight:500}
.ph-slot small{color:var(--muted);font-weight:400}
.ph-img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:20px}
.src{margin:8px 0 0;font-size:14px;color:var(--muted)}
.src summary{cursor:pointer;padding:8px 0}
/* login */
.login-wrap{min-height:calc(100vh - 64px);display:grid;place-items:center;padding:40px 20px}
.login-card{width:100%;max-width:400px}
.login-card input{width:100%}
.su-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
input.bad,textarea.bad{border-color:var(--red);background:#fffafa}
.pw-wrap{position:relative}
.pw-wrap input{padding-right:64px}
.pw-toggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--tan-d);font-size:13px;font-weight:500;padding:6px 8px;border-radius:8px}
.pw-toggle:hover{background:var(--gray-bg)}
label .opt{font-weight:400;color:var(--muted)}
.ap-row{display:grid;grid-template-columns:2fr 1fr 1fr 1.4fr;gap:12px}
.ap-row input{width:100%}
@media (max-width:760px){.ap-row{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.su-row{grid-template-columns:1fr}}

/* dashboard */
.dash{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 64px)}
.side{background:var(--brown);color:var(--cream);padding:22px 14px;display:flex;flex-direction:column;gap:4px}
.side .who{padding:4px 10px 16px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:10px}
.side .who b{display:block;font-family:'Fraunces',serif;font-size:18px}
.side .who small{opacity:.7}
.side button{background:transparent;border:0;color:var(--cream);text-align:left;padding:10px 12px;border-radius:10px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.side button:hover{background:rgba(255,255,255,.08)}
.side button.active{background:rgba(255,255,255,.16);font-weight:500}
.side .badge{background:var(--tan);color:#fff;font-size:12px;border-radius:999px;padding:1px 8px}
.side .spacer{flex:1}
.main{padding:28px;overflow:auto}
.main h2{font-size:28px}
.toprow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px}
.kpi small{color:var(--muted);font-size:13px}
.kpi b{display:block;font-size:28px;font-family:'Fraunces',serif;color:var(--brown)}
table{width:100%;border-collapse:collapse;background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden;font-size:14.5px}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line)}
th{font-weight:500;color:var(--muted);font-size:13px;background:#FBF7F0}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click td:first-child b{white-space:nowrap}
tr.click:hover td{background:#FBF5EA}
tr.sel td{background:#F6EBDB}
td input{width:80px;padding:6px 8px}
.pill{display:inline-block;font-size:12.5px;padding:3px 10px;border-radius:999px;font-weight:500;white-space:nowrap}
.s-awaiting{background:var(--amber-bg);color:var(--amber)}
.s-counter{background:var(--blue-bg);color:var(--blue)}
.s-approved{background:var(--green-bg);color:var(--green)}
.s-in_production{background:var(--blue-bg);color:var(--blue)}
.s-ready{background:var(--green-bg);color:var(--green)}
.s-delivered{background:var(--gray-bg);color:var(--muted)}
.s-rejected{background:var(--red-bg);color:var(--red)}
.split{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;align-items:start}
.detail h3{font-size:22px;margin-bottom:4px}
.feas{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.feas div{border-radius:12px;padding:10px 12px}
.feas .a{background:var(--green-bg);color:var(--green)}
.feas .b{background:var(--amber-bg);color:var(--amber)}
.feas .c{background:var(--blue-bg);color:var(--blue)}
.feas b{display:block;font-size:22px;font-family:'Fraunces',serif}
.feas small{font-size:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.wa-msg{background:#E9F7EE;border:1px solid #CBEBD6;border-radius:12px;padding:10px 12px;font-size:13.5px;white-space:pre-line;color:#16462A;margin-top:12px}
.log{list-style:none;margin:0;padding:0}
.log li{display:flex;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.log li time{color:var(--muted);min-width:110px;font-size:13px}
.log .who{font-size:12px;border-radius:999px;padding:1px 8px;background:var(--gray-bg);margin-left:6px}
.empty{padding:22px;text-align:center;color:var(--muted)}
.toast{position:fixed;right:20px;bottom:20px;background:var(--brown);color:var(--cream);padding:12px 16px;border-radius:12px;font-size:14px;max-width:340px;opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none;z-index:20}
.toast.show{opacity:1;transform:none}
.demo-strip{background:var(--amber-bg);color:var(--amber);font-size:13px;text-align:center;padding:6px 12px}

@media (max-width:860px){
  .hero .wrap,.cols,.split{grid-template-columns:1fr}
  .steps,.designs,.makers,.probs,.about-grid{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
  .timeline li{grid-template-columns:1fr;gap:2px}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .dash{grid-template-columns:1fr}
  .side{flex-direction:row;overflow-x:auto;padding:10px;gap:6px}
  .side .who,.side .spacer{display:none}
  .side button{white-space:nowrap}
  nav.main a{padding:6px 8px;font-size:14px}
}
</style>
</head>
<body>
<div class="demo-strip">Prototype for the hackathon demo. WhatsApp numbers and data are samples.</div>
<header class="site">
  <div class="wrap">
    <a class="logo" href="#home"><svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3c6 0 9 5 9 12s-3 14-9 14-9-7-9-14 3-12 9-12z" fill="#C8874A"/><path d="M8 13h16M12 9c2 2 6 2 8 0" stroke="#3B2416" stroke-width="2" fill="none" stroke-linecap="round"/></svg>Karigar<span>Setu</span></a>
    <nav class="main" id="nav"></nav>
  </div>
</header>
<main id="app"></main>
<div class="toast" id="toast"></div>

<script>
const IMG = { "pair": "assets/images/chappal-pair.jpg", "tools": "assets/images/leather-tools.jpg", "stitch": "assets/images/artisan-stitching-sole.jpg", "stitch2": "assets/images/artisan-stitching-strap.jpg"};
let TODAY = new Date('2026-11-16T09:00:00');
const fmt = d => d.toLocaleDateString('en-IN',{day:'numeric',month:'short'});
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const rupee = n => '₹' + Math.round(n).toLocaleString('en-IN');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// Contact details and the KarigarSetu WhatsApp bot. Replaced by /public/info when the server is running.
let CONTACT = {email:'contact@karigarsetu.co.in', whatsapp:'15551567876'};
const phoneLabel = d => { d = String(d||'');
  if (d.length === 11 && d[0] === '1') return `+1 ${d.slice(1,4)} ${d.slice(4,7)} ${d.slice(7)}`;
  if (d.length === 12 && d.startsWith('91')) return `+91 ${d.slice(2,7)} ${d.slice(7)}`;
  return d ? '+' + d : ''; };

// Makers on the home page. Replaced by the live list (/public/makers) when the server is running.
const MAKER_COLORS = ['#E9D2B4','#D9C2A2','#E4CBA8','#D7BC98'];
let MAKERS = [
  {id:'kendra', name:'Kolhapur Chappal Kendra', place:'Kolhapur, Maharashtra', since:'Verified KarigarSetu supplier', designs:['Kolhapuri Classic','Kapshi','Paytan'], facts:[['From ₹480','Per pair'],['20 pairs','Minimum order'],['18 pairs/day','Capacity']], color:'#E9D2B4'},
  {id:'patil', name:'Patil Chappal Udyog', place:'Kapshi, Kolhapur district', since:'Verified KarigarSetu supplier', designs:['Kapshi','Kachkadi','Pukari'], facts:[['From ₹420','Per pair'],['30 pairs','Minimum order'],['15 pairs/day','Capacity']], color:'#D9C2A2'}
];

/* Add a maker's photo by setting img to a data: URI (remote images are blocked in the artifact) */
const DESIGNS = [
  {name:'Kapshi', desc:'Soft leather, pointed toe, decorated strap', c:'#EAD7BC', s:'#8A4A1C', img:''},
  {name:'Paytan', desc:'Fine hand braiding, the classic look', c:'#D8B88E', s:'#4A2410', img:''},
  {name:'Kachkadi', desc:'Braided leather all over the upper', c:'#E2C49C', s:'#5E2E0E', img:''},
  {name:'Pukari', desc:'Plain and sturdy, for everyday wear', c:'#E9D2B4', s:'#7A3E14', img:''}
];

const S = {
  loggedIn:false, view:'overview', selected:'KS-1042', counterOpen:false, lastMsg:null,
  maker:'Shinde Footwear',
  sizes:[6,7,8,9,10],
  products:[
    {id:'classic', name:'Kolhapuri Classic', price:550},
    {id:'kapshi', name:'Kapshi', price:620},
    {id:'paytan', name:'Paytan', price:480}
  ],
  stock:{ classic:{6:4,7:6,8:8,9:6,10:3}, kapshi:{6:2,7:5,8:6,9:4,10:1}, paytan:{6:6,7:8,8:9,9:7,10:4} },
  capacity:{ classic:6, kapshi:4, paytan:8 }, buffer:3,
  committed:{ classic:0, kapshi:24, paytan:0 },
  orders:[
    {id:'KS-1042', retailer:'Pune Footwear House', city:'Pune', lang:'Marathi', product:'classic', lines:{7:15,8:20,9:15}, status:'awaiting', created:'16 Nov, 01:42', price:550},
    {id:'KS-1039', retailer:'Nashik Heritage Store', city:'Nashik', lang:'Hindi', product:'kapshi', lines:{7:10,8:16,9:14}, status:'in_production', created:'12 Nov, 11:05', price:620, due:'24 Nov', _make:24},
    {id:'KS-1036', retailer:'Mumbai Craft Co.', city:'Mumbai', lang:'English', product:'paytan', lines:{8:12,9:12}, status:'delivered', created:'4 Nov, 16:20', price:480, due:'11 Nov'}
  ],
  audit:[
    {t:'16 Nov, 01:44', who:'System', text:'Approval request sent to maker on WhatsApp for KS-1042'},
    {t:'16 Nov, 01:43', who:'System', text:'Feasibility for KS-1042: 20 ready, 30 to make, earliest 24 Nov'},
    {t:'16 Nov, 01:42', who:'AI agent', text:'Drafted KS-1042 from Marathi message: Classic, 50 pairs (7:15, 8:20, 9:15)'},
    {t:'15 Nov, 18:10', who:'Maker', text:'KS-1039 marked in production'},
    {t:'12 Nov, 11:20', who:'Maker', text:'Approved KS-1039 via WhatsApp'},
    {t:'11 Nov, 09:30', who:'Maker', text:'KS-1036 marked delivered'}
  ],
  seq:1043, clock:45
};

const pname = id => S.products.find(p=>p.id===id).name;
const qty = o => Object.values(o.lines).reduce((a,b)=>a+b,0);
const nowStamp = () => { const m = S.clock++; return '16 Nov, ' + String(1+Math.floor(m/60)).padStart(2,'0') + ':' + String(m%60).padStart(2,'0'); };
const log = (who,text) => S.audit.unshift({t:nowStamp(), who, text});

function feasibility(o){
  let ready=0, make=0; const rows=[];
  for (const [size,q] of Object.entries(o.lines)){
    const have = S.stock[o.product][size]||0;
    const r = Math.min(have,q), m = q-r;
    ready+=r; make+=m; rows.push({size,q,r,m,have});
  }
  const cap = S.capacity[o.product];
  const days = make>0 ? Math.ceil((S.committed[o.product]+make)/cap) + S.buffer : 1;
  return {ready, make, rows, days, date: fmt(addDays(TODAY,days))};
}

function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2600); }

/* ---------- shared bits ---------- */
function chappal(color, strap){
  return `<svg width="150" height="110" viewBox="0 0 150 110" aria-hidden="true">
    <g transform="rotate(-18 75 55)">
      <path d="M75 8c18 0 26 14 26 36s-8 58-26 58-26-36-26-58 8-36 26-36z" fill="${color}" stroke="#9A5B26" stroke-width="2"/>
      <path d="M75 14c13 0 19 11 19 30s-6 50-19 50-19-31-19-50 6-30 19-30z" fill="none" stroke="#9A5B26" stroke-width="1" stroke-dasharray="3 3"/>

}

  const o = S.orders.find(x=>x.id===S.selected) || S.orders[0];

function orderDetail(o){
  const f = feasibility(o);
  const total = qty(o)*o.price;
  let actions = '';
  if (o.status==='awaiting'){
    actions = `<div class="actions"><button class="btn ok" data-act="approve">Approve</button><button class="btn" data-act="counter">Propose change</button><button class="btn danger" data-act="reject">Reject</button></div>
    ${S.counterOpen?`<div style="margin-top:14px;border-top:1px solid var(--line);padding-top:14px">
      <div class="cols" style="gap:12px"><div class="field"><label for="cd">New delivery date</label><input id="cd" type="date" value="${addDays(TODAY,f.days+3).toISOString().slice(0,10)}"></div>
      <div class="field"><label for="cp">Price per pair (₹)</label><input id="cp" type="number" step="1" value="${o.price}"></div></div>
      <button class="btn primary sm" data-act="sendCounter">Send to retailer</button></div>`:''}`;
  } else if (o.status==='counter'){
    actions = `<div class="actions"><button class="btn ok" data-act="retailerAccept">Simulate retailer accepts</button><button class="btn danger" data-act="retailerDecline">Simulate retailer declines</button></div>`;
  } else if (o.status==='approved'){
    actions = `<div class="actions"><button class="btn primary" data-act="advance" data-to="in_production">Mark in production</button></div>`;
  } else if (o.status==='in_production'){
    actions = `<div class="actions"><button class="btn primary" data-act="advance" data-to="ready">Mark ready to ship</button></div>`;
  } else if (o.status==='ready'){
    actions = `<div class="actions"><button class="btn primary" data-act="advance" data-to="delivered">Mark delivered</button></div>`;
  }
  const showFeas = ['awaiting','counter'].includes(o.status);
  return `<div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start"><div><h3>${o.id}</h3><div class="note">${esc(o.retailer)} · ${o.city} · ordered in ${o.lang}</div></div><span class="pill s-${o.status}">${statusLabel(o.status)}</span></div>
  <p style="margin:12px 0 4px"><b>${pname(o.product)}</b>, ${qty(o)} pairs · ${rupee(o.price)}/pair · <b>${rupee(total)}</b></p>

  ${showFeas?`<div class="feas"><div class="a"><b>${f.ready}</b><small>Ready now</small></div><div class="b"><b>${f.make}</b><small>To make</small></div><div class="c"><b>${o.due||f.date}</b><small>${o.due?'Agreed date':'Earliest delivery'}</small></div></div>
  <table style="font-size:13.5px"><thead><tr><th>Size</th><th>Ordered</th><th>In stock</th><th>Ready</th><th>To make</th></tr></thead><tbody>

  <p class="note" style="margin-top:8px">Calculated from your stock and capacity: ${S.capacity[o.product]} pairs/day, ${S.committed[o.product]} already committed, ${S.buffer} buffer days.</p>`

  ${actions}

/* ---------- actions ---------- */
const RETAILERS = [['Kolhapur Footwear Mart','Kolhapur','Marathi'],['Mumbai Craft Co.','Mumbai','English'],['Indore Juti Ghar','Indore','Hindi'],['Satara Chappal Bazaar','Satara','Marathi']];
function simulate(){
  const [r,c,l] = RETAILERS[S.seq % RETAILERS.length];
  const p = S.products[S.seq % 3];
  const lines = {7: 6+(S.seq%5)*2, 8: 10+(S.seq%3)*4, 9: 6+(S.seq%4)*2};
  const o = {id:'KS-'+(S.seq++), retailer:r, city:c, lang:l, product:p.id, lines, status:'awaiting', created:nowStamp(), price:p.price};
  S.orders.unshift(o);
  const f = feasibility(o);
  log('AI agent', `Drafted ${o.id} from ${l} message: ${p.name}, ${qty(o)} pairs`);
  log('System', `Feasibility for ${o.id}: ${f.ready} ready, ${f.make} to make, earliest ${f.date}`);
  log('System', `Approval request sent to maker on WhatsApp for ${o.id}`);
  S.selected = o.id; S.view='orders'; S.counterOpen=false;
  toast(`New order ${o.id} from ${r}`);
}
function approve(o, viaRetailer){
  const f = feasibility(o);
  for (const r of f.rows){ S.stock[o.product][r.size] -= r.r; }
  S.committed[o.product] += f.make; o._make = f.make;
  if (!o.due) o.due = f.date;
  o.status = 'approved';
  if (!viaRetailer) log('Maker', `Approved ${o.id}: ${qty(o)} pairs, ${rupee(o.price)}/pair, delivery ${o.due}`);
  log('System', `Reserved ${f.ready} ready pairs and booked ${f.make} for production`);
  log('System', `Confirmation sent to ${o.retailer} on WhatsApp`);
  S.lastMsg = {id:o.id, text:`Your order ${o.id} is confirmed by ${S.maker}.\n${pname(o.product)}, ${qty(o)} pairs, ${rupee(qty(o)*o.price)}.\nDelivery by ${o.due}. We'll update you here.`};
}

document.addEventListener('click', e=>{
  const sc = e.target.closest('[data-scroll]');
  if (sc){ document.getElementById(sc.dataset.scroll).scrollIntoView({behavior:'smooth'}); return; }
  const tab = e.target.closest('[data-tab]');
  if (tab){ S.view = tab.dataset.tab; S.counterOpen=false; render(); if (LIVE) refresh().then(render).catch(err=>toast(err.message)); return; }
  const row = e.target.closest('[data-open]');
  if (row){ S.selected=row.dataset.open; S.view='orders'; S.counterOpen=false; if (LIVE) S.lastMsg=null; render(); if (LIVE) loadDetail(S.selected).then(render).catch(err=>toast(err.message)); return; }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const o = S.orders.find(x=>x.id===S.selected);
  if (LIVE){ liveAction(a, o); return; }
  switch (a.dataset.act){
    case 'logout': S.loggedIn=false; location.hash='login'; return;
    case 'simulate': simulate(); break;
    case 'approve': approve(o); S.counterOpen=false; toast(`${o.id} approved. Retailer notified.`); break;
    case 'reject': o.status='rejected'; log('Maker',`Rejected ${o.id}`); log('System',`Polite decline sent to ${o.retailer} on WhatsApp`);
      S.lastMsg={id:o.id,text:`Sorry, ${S.maker} can't take order ${o.id} right now. You can try another maker on KarigarSetu.`}; toast(`${o.id} rejected`); break;
    case 'counter': S.counterOpen=!S.counterOpen; break;
    case 'sendCounter': {
      const d = document.getElementById('cd').value, p = Math.round(+document.getElementById('cp').value);
      if (!d || !p || p<1){ toast('Enter a date and a price first'); return; }
      o.due = fmt(new Date(d+'T09:00:00')); o.price = p; o.status='counter';
      log('Maker',`Proposed change for ${o.id}: ${rupee(p)}/pair, delivery ${o.due}`);
      log('System',`Counter-offer sent to ${o.retailer} on WhatsApp`);
      S.lastMsg={id:o.id,text:`${S.maker} can do order ${o.id} at ${rupee(p)}/pair with delivery by ${o.due}.\nReply YES to confirm or NO to cancel.`};
      S.counterOpen=false; toast('Counter-offer sent'); break; }
    case 'retailerAccept': log('Retailer',`Accepted counter-offer for ${o.id}`); approve(o,true); toast(`${o.id} confirmed`); break;
    case 'retailerDecline': o.status='rejected'; log('Retailer',`Declined counter-offer for ${o.id}`); S.lastMsg=null; break;
    case 'advance': {
      const to = a.dataset.to; o.status = to;
      if (to==='ready'){ const f=qtyMake(o); S.committed[o.product]=Math.max(0,S.committed[o.product]-f); }
      log('Maker',`${o.id} marked ${statusLabel(to).toLowerCase()}`);
      log('System',`Status update sent to ${o.retailer} on WhatsApp`);
      S.lastMsg={id:o.id,text:`Update on ${o.id}: ${statusLabel(to)}.`}; break; }
  }
  render();
});
function qtyMake(o){ return o._make ?? 0; }

document.addEventListener('change', e=>{
  const t = e.target; const v = Math.max(0, Math.round(+t.value||0));
  if (LIVE){ liveChange(t); return; }
  if (t.dataset.stock){ const [p,s]=t.dataset.stock.split(':'); S.stock[p][s]=v; log('Maker',`Stock updated: ${pname(p)} size ${s} = ${v}`); render(); }
  else if (t.dataset.cap){ S.capacity[t.dataset.cap]=Math.max(1,v); log('Maker',`Capacity updated: ${pname(t.dataset.cap)} = ${Math.max(1,v)} pairs/day`); render(); }
  else if (t.dataset.buffer){ S.buffer=v; log('Maker',`Buffer days set to ${v}`); render(); }
  else if (t.dataset.price){ const p=S.products.find(x=>x.id===t.dataset.price); p.price=Math.max(1,v); log('Maker',`Price updated: ${p.name} = ${rupee(p.price)}`); render(); }
});

/* ---------- form checks: one set of rules for every form ----------
   The server applies the same rules (backend/app/validation.py), so they can't be skipped.
   Errors appear under each field, when you leave it and when you press the button. */
const EMAIL_OK = /^[A-Za-z0-9._%+-]+@[A-Za-z0-9](?:[A-Za-z0-9-]*[A-Za-z0-9])?(?:\.[A-Za-z0-9](?:[A-Za-z0-9-]*[A-Za-z0-9])?)*\.[A-Za-z]{2,}$/;
const squash = v => v.trim().replace(/\s+/g, ' ');
const lettersOk = (v, extra) => new RegExp(`^[\\p{L}\\p{M}${extra}]+$`, 'u').test(v) && /\p{L}/u.test(v);
const R = {
  personName: v => { v = squash(v);
    if (v.length < 2) return 'Please enter your name.';
    if (v.length > 100) return 'Name is too long (max 100 characters).';
    if (!lettersOk(v, " .'\\-")) return 'Name can only have letters, spaces, dots, apostrophes and hyphens.';
    return ''; },
  business: v => { v = squash(v);
    if (v.length < 2) return 'Please enter your business name.';
    if (v.length > 100) return 'Business name is too long (max 100 characters).';
    if (!lettersOk(v.replace(/[&0-9]/g, ''), " .,'\\-()/")) return "Business name can have letters, numbers, spaces and . , & ' - ( ) /";
    return ''; },
  placeOrCraft: label => v => { v = squash(v);
    if (v.length < 2) return `Please enter your ${label}.`;
    if (v.length > 80) return `${label[0].toUpperCase() + label.slice(1)} is too long (max 80 characters).`;
    if (!lettersOk(v.replace(/&/g, ''), " .,'\\-()/")) return `${label[0].toUpperCase() + label.slice(1)} can only have letters, spaces and . , & ' - ( ) /`;
    return ''; },
  email: v => { v = v.trim();
    if (!v) return 'Please enter your email address.';
    if (v.length > 254 || v.includes('..') || !EMAIL_OK.test(v)) return 'Please enter a valid email address, like name@example.com.';
    return ''; },
  whatsapp: v => { v = v.trim();
    if (!v) return 'Please enter your WhatsApp number.';
    if (!/^\+?[\d\s()-]+$/.test(v)) return 'WhatsApp number can only have digits, spaces, + and -.';
    let d = v.replace(/\D/g, '');
    if (d.length === 11 && d[0] === '0') d = d.slice(1);
    if (d.length === 10){ if (!/[6-9]/.test(d[0])) return 'Indian mobile numbers start with 6, 7, 8 or 9. Add the country code for other countries.'; d = '91' + d; }
    if (d.length === 12 && d.startsWith('91') && !/[6-9]/.test(d[2])) return 'Indian mobile numbers start with 6, 7, 8 or 9.';
    if (d.length < 11 || d.length > 15) return 'Please enter a valid WhatsApp number: 10 digits, or with the country code.';
    return ''; },
  phoneOptional: v => { v = v.trim();
    if (!v) return '';
    if (!/^\+?[\d\s()-]+$/.test(v)) return 'Phone number can only have digits, spaces, + and -.';
    const n = v.replace(/\D/g, '').length;
    if (n < 10 || n > 15) return 'Please enter a valid phone number (10 to 15 digits), or leave it empty.';
    return ''; },
  newPassword: emailId => v => {
    if (v.length < 8) return 'Password must be at least 8 characters.';
    if (new TextEncoder().encode(v).length > 72) return 'Password is too long (max 72 characters).';
    if (!/[A-Za-z\u0900-\u097F]/.test(v) || !/\d/.test(v)) return 'Password needs at least one letter and one number.';
    if (v.trim() !== v) return "Password can't start or end with a space.";
    const em = (document.getElementById(emailId) || {}).value || '';
    if (em && v.toLowerCase() === em.trim().toLowerCase()) return "Password can't be the same as your email.";
    return ''; },
  confirm: otherId => v => !v ? 'Please type the password again.' : (v !== document.getElementById(otherId).value ? 'Passwords do not match.' : ''),
  required: msg => v => v ? '' : msg,
  message: v => { v = v.trim();
    if (v.length < 10) return 'Please write a message (at least 10 characters).';
    if (v.length > 2000) return 'Message is too long (max 2000 characters).';
    return ''; },
  designName: v => { v = squash(v);
    if (v.length < 2) return 'Enter the design name.';
    if (v.length > 80) return 'Design name is too long (max 80 characters).';
    if (!lettersOk(v.replace(/[0-9]/g, ''), " .,'\\-()/&")) return "Design name can have letters, numbers, spaces and . , ' - ( ) / &";
    return ''; },
  wholeNumber: (label, low, high) => v => { v = v.trim();
    if (!v) return `Enter the ${label.toLowerCase()}.`;
    if (!/^\d+$/.test(v)) return `${label} must be a whole number.`;
    const n = +v; if (n < low || n > high) return `${label} must be between ${low.toLocaleString('en-IN')} and ${high.toLocaleString('en-IN')}.`;
    return ''; },
  sizes: v => { const parts = v.trim().split(/[,\s]+/).filter(Boolean);
    if (!parts.length) return 'Enter the sizes, e.g. 6,7,8,9,10';
    if (!parts.every(p => /^\d+$/.test(p))) return 'Sizes must be numbers separated by commas, e.g. 6,7,8,9,10';
    const n = parts.map(Number); if (n.some(x => x < 1 || x > 15)) return 'Sizes must be between 1 and 15.';
    if (new Set(n).size !== n.length) return 'Each size only once, please.';
    return ''; }
};
const FORMS = {
  contactForm:  {'cf-name': R.personName, 'cf-email': R.email, 'cf-phone': R.phoneOptional, 'cf-msg': R.message},
  signupForm:   {'su-name': R.personName, 'su-biz': R.business, 'su-craft': R.placeOrCraft('craft'), 'su-town': R.placeOrCraft('town or city'),
                 'su-ph': R.whatsapp, 'su-em': R.email, 'su-pw': R.newPassword('su-em'), 'su-pw2': R.confirm('su-pw')},
  loginForm:    {'em': R.email, 'pw': R.required('Please enter your password.')},
  addProductForm: {'ap-name': R.designName, 'ap-price': R.wholeNumber('Price per pair', 1, 100000),
                   'ap-cap': R.wholeNumber('Pairs per day', 1, 1000), 'ap-sizes': R.sizes}
};
// Which field a message from the server belongs to (e.g. "An account with this email already exists").
const SERVER_FIELD = {
  signupForm: [[/password.*match/i,'su-pw2'], [/password/i,'su-pw'], [/whatsapp|mobile/i,'su-ph'], [/email/i,'su-em'],
               [/business/i,'su-biz'], [/craft/i,'su-craft'], [/town|city/i,'su-town'], [/name/i,'su-name']],
  contactForm: [[/email/i,'cf-email'], [/phone/i,'cf-phone'], [/message/i,'cf-msg'], [/name/i,'cf-name']],
  addProductForm: [[/price/i,'ap-price'], [/pairs per day/i,'ap-cap'], [/size/i,'ap-sizes'], [/design/i,'ap-name']]
};
const ruleOf = id => { for (const f of Object.values(FORMS)) if (f[id]) return f[id]; return null; };
function setFieldError(id, msg){
  const el = document.getElementById(id); if (!el) return;
  const box = el.closest('.field');
  let e = box.querySelector('.ferr');
  if (!e){ e = document.createElement('div'); e.className = 'err ferr'; e.id = id + '-err'; box.appendChild(e); el.setAttribute('aria-describedby', e.id); }
  e.textContent = msg || '';
  el.classList.toggle('bad', !!msg); el.setAttribute('aria-invalid', msg ? 'true' : 'false');
}
function checkField(id){ const rule = ruleOf(id), el = document.getElementById(id); if (!rule || !el) return true;
  const msg = rule(el.value); setFieldError(id, msg); return !msg; }
function checkForm(formId){
  const bad = Object.keys(FORMS[formId]).filter(id => !checkField(id));
  if (bad.length) document.getElementById(bad[0]).focus();
  return !bad.length;
}
function showServerError(formId, msg, generalEl){
  const hit = (SERVER_FIELD[formId] || []).find(([re]) => re.test(msg));
  if (hit && document.getElementById(hit[1])){ setFieldError(hit[1], msg); document.getElementById(hit[1]).focus(); }
  else generalEl.textContent = msg;
}
document.addEventListener('focusout', e => {
  const id = e.target.id;
  if (ruleOf(id) && (e.target.value || e.target.dataset.touched)) { e.target.dataset.touched = '1'; checkField(id); }
});
document.addEventListener('click', e => {
  const t = e.target.closest('.pw-toggle'); if (!t) return;
  const input = document.getElementById(t.dataset.pw), show = input.type === 'password';
  input.type = show ? 'text' : 'password'; t.textContent = show ? 'Hide' : 'Show';
  t.setAttribute('aria-label', show ? 'Hide password' : 'Show password'); input.focus();
});

document.addEventListener('submit', e=>{
  e.preventDefault();
  if (e.target.id==='contactForm'){
    const v = id => document.getElementById(id).value;
    const err = document.getElementById('cfErr'); err.textContent = '';
    if (!checkForm('contactForm')) return;
    const body = {name:squash(v('cf-name')), email:v('cf-email').trim(), phone:squash(v('cf-phone')), message:v('cf-msg').trim(), website:v('cf-web')};
    if (LIVE){ liveContact(body, err); return; }
    S.contactSent = 'Thank you! (Prototype: not sent.)'; render();
  }
  if (e.target.id==='addProductForm'){
    const v = id => document.getElementById(id).value;
    const err = document.getElementById('apErr'); err.textContent = '';
    if (!checkForm('addProductForm')) return;
    const body = {name:squash(v('ap-name')), price_per_pair:+v('ap-price'), pairs_per_day:+v('ap-cap'), sizes:v('ap-sizes')};
    if (LIVE){ liveAddProduct(body, err); return; }
    const id = body.name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || 'design';
    if (S.products.some(p => p.id === id)){ setFieldError('ap-name', 'You already have this design.'); return; }
    S.products.push({id, name:body.name, price:body.price_per_pair}); S.capacity[id] = body.pairs_per_day; S.committed[id] = 0;
    S.stock[id] = Object.fromEntries(S.sizes.map(z => [z, 0])); log('Maker', `Added design ${body.name}`); toast(`${body.name} added`); render();
  }
  if (e.target.id==='signupForm'){
    const v = id => document.getElementById(id).value;
    const err = document.getElementById('signupErr'); err.textContent = '';
    if (!checkForm('signupForm')) return;
    const body = {name:squash(v('su-name')), business_name:squash(v('su-biz')), craft:squash(v('su-craft')), town:squash(v('su-town')),
                  phone:v('su-ph').trim(), email:v('su-em').trim(), password:v('su-pw'), confirm_password:v('su-pw2')};
    if (LIVE){ liveSignup(body, err); return; }
    S.signedUp = "Your account is under review. We'll message you on WhatsApp once it's approved. (Prototype: not sent.)"; render();
  }
  if (e.target.id==='loginForm'){
    const err=document.getElementById('loginErr'); err.textContent = '';
    if (!checkForm('loginForm')) return;
    const em=document.getElementById('em').value.trim().toLowerCase(), pw=document.getElementById('pw').value;
    if (LIVE){ liveLogin(em, pw, err); return; }
    if (em!=='demo@karigarsetu.in' || pw!=='Demo@12345'){ err.textContent='Invalid email or password. Prototype login: demo@karigarsetu.in / Demo@12345'; return; }
    S.loggedIn=true; S.view='overview'; location.hash='dashboard'; render();
  }
});
document.addEventListener('input', e=>{
  const form = e.target.closest('form'); if (!form || !FORMS[form.id]) return;
  const general = {contactForm:'cfErr', signupForm:'signupErr', loginForm:'loginErr', addProductForm:'apErr'}[form.id];
  if (general && document.getElementById(general)) document.getElementById(general).textContent = '';
  if (e.target.id === 'cf-msg') document.getElementById('cf-count').textContent = e.target.value.length + ' / 2000';
  if (e.target.classList.contains('bad')) checkField(e.target.id);                       // clear as soon as it's fixed
  if (e.target.id === 'su-pw' && document.getElementById('su-pw2').dataset.touched) checkField('su-pw2');
});

/* ---------- live mode: when this page is served by the KarigarSetu server, use the real API ---------- */
let LIVE = false, TOKEN = null;
const STATUS_IN = {awaiting_maker:'awaiting', counter_offered:'counter'};
const ACTION_TEXT = {
  'order.drafted':'AI drafted the order', 'order.feasibility':'Feasibility checked', 'maker.notified':'Approval request sent to maker',
  'order.approved':'Approved', 'stock.reserved':'Stock reserved', 'retailer.notified':'Retailer notified on WhatsApp',
  'order.rejected':'Rejected', 'order.counter':'Change proposed', 'counter.accepted':'Retailer accepted the change',
  'counter.declined':'Retailer declined the change', 'order.in_production':'Marked in production', 'order.ready':'Marked ready to ship',
  'order.delivered':'Marked delivered', 'stock.updated':'Stock updated', 'product.updated':'Product updated', 'product.added':'Design added',
  'account.signup':'Supplier signed up', 'account.approved':'Supplier account approved', 'account.rejected':'Supplier account rejected',
  'settings.updated':'Settings updated', 'login':'Logged in', 'whatsapp.in':'WhatsApp message received',
  'agent.action':'Ops agent acting on maker\'s message', 'agent.failed':'Ops agent action refused'
};
const fmtTs = iso => {
  const d = new Date(/[zZ]|[+-]\d\d:?\d\d$/.test(iso) ? iso : iso + 'Z');
  return d.toLocaleDateString('en-IN',{day:'numeric',month:'short'}) + ', ' + d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:false});
};
const fmtDay = s => s ? fmt(new Date(s + 'T09:00:00')) : null;
// The login is remembered on this device until you log out (or it expires on the server), in every tab.
const saveToken = t => { try { t ? localStorage.setItem('ks_token', t) : localStorage.removeItem('ks_token'); sessionStorage.removeItem('ks_token'); } catch (e) {} };
const loadToken = () => { try { return localStorage.getItem('ks_token') || sessionStorage.getItem('ks_token'); } catch (e) { return null; } };
function endSession(goTo){
  TOKEN = null; saveToken(null); S.loggedIn = false; S.selected = null;
  location.hash = goTo || 'login'; render();
}
// Logged out (or in) in another tab: follow it here.
window.addEventListener('storage', e => {
  if (!LIVE || e.key !== 'ks_token') return;
  if (!e.newValue && TOKEN) endSession('login');
  else if (e.newValue && e.newValue !== TOKEN){ TOKEN = e.newValue; refresh().then(() => { S.loggedIn = true; render(); }).catch(() => endSession('login')); }
});

async function api(method, path, body){
  const r = await fetch(path, {method, headers:{'Content-Type':'application/json', ...(TOKEN ? {Authorization:'Bearer ' + TOKEN} : {})},
                               body: body ? JSON.stringify(body) : undefined});
  const data = await r.json().catch(() => ({}));
  if (r.status === 401 && TOKEN){ endSession('login'); throw new Error('Your session ended. Please log in again.'); }
  if (!r.ok) throw new Error(typeof data.detail === 'string' ? data.detail : 'Something went wrong. Try again.');
  return data;
}

async function refresh(){
  const [me, products, stock, list, rows] = await Promise.all([
    api('GET','/api/me'), api('GET','/api/products'), api('GET','/api/stock'), api('GET','/api/orders'), api('GET','/api/audit?limit=150')]);
  S.maker = me.name; S.place = (me.place || '').split(',')[0]; S.buffer = me.buffer_days;
  S.products = products.map(p => ({id:p.code, name:p.name, price:p.price_per_pair, sizes:p.sizes.split(',').map(Number)}));
  if (products.length) S.sizes = [...new Set(products.flatMap(p => p.sizes.split(',').map(Number)))].sort((a, b) => a - b);
  S.capacity = {}; S.committed = {};
  products.forEach(p => { S.capacity[p.code] = p.pairs_per_day; S.committed[p.code] = p.committed; });
  S.stock = {}; stock.forEach(r => { S.stock[r.product_code] = {...r.sizes}; });
  S.orders = list.map(o => ({id:o.code, retailer:o.retailer_name, retailerPhone:o.retailer_phone, city:o.city || '-',
    lang:o.language || 'WhatsApp', product:o.product_code, lines:Object.fromEntries(o.lines.map(l => [l.size, l.qty])),
    status:STATUS_IN[o.status] || o.status, created:fmtTs(o.created_at), price:o.price_per_pair, due:fmtDay(o.due_date), _make:o.to_make,
    reqPrice:o.requested_price, reqDate:fmtDay(o.requested_date)}));
  S.audit = rows.map(a => ({t:fmtTs(a.ts), who:a.actor,
    text:(a.order_code ? a.order_code + ': ' : '') + (ACTION_TEXT[a.action] || a.action) + (a.detail ? ' · ' + a.detail : '')}));
  if (!S.orders.find(o => o.id === S.selected)) S.selected = S.orders[0] ? S.orders[0].id : null;
  if (S.selected) await loadDetail(S.selected);
}

async function loadDetail(code){
  const d = await api('GET', '/api/orders/' + encodeURIComponent(code));
  const out = (d.messages || []).filter(m => m.direction === 'out' && m.phone === d.retailer_phone);
  S.lastMsg = out.length ? {id:d.code, text:out[out.length - 1].body} : null;
}

async function liveLogin(email, password, err){
  const btn = document.getElementById('loginBtn'); btn.disabled = true; btn.textContent = 'Logging in…';
  try {
    const r = await api('POST', '/auth/login', {email, password});
    TOKEN = r.token; saveToken(TOKEN);
    await refresh();
    S.loggedIn = true; S.view = 'overview'; location.hash = 'dashboard'; render();
  } catch (e){ err.textContent = e.message; btn.disabled = false; btn.textContent = 'Log in'; }
}

async function liveContact(body, err){
  const btn = document.getElementById('cfBtn'); btn.disabled = true; btn.textContent = 'Sending…';
  try { const r = await api('POST', '/api/contact', body); S.contactSent = r.message; render(); }
  catch (e){ showServerError('contactForm', e.message, err); btn.disabled = false; btn.textContent = 'Send message'; }
}

async function loadPublic(){
  try {
    const [info, makers] = await Promise.all([api('GET', '/public/info'), api('GET', '/public/makers')]);
    CONTACT = {email: info.email || CONTACT.email, whatsapp: info.whatsapp || CONTACT.whatsapp};
    MAKERS = makers.map((m, i) => ({id:'m' + m.id, name:m.name, place:m.place, since:'Verified KarigarSetu supplier',
      designs:m.designs.map(d => d.name), link:m.whatsapp, color:MAKER_COLORS[i % MAKER_COLORS.length],
      facts:[['From ' + rupee(m.price_from), 'Per pair'], [m.min_order + ' pairs', 'Minimum order'], [m.pairs_per_day + ' pairs/day', 'Capacity']]}));
  } catch (e) { /* keep the built-in sample list */ }
}

async function liveAddProduct(body, err){
  const btn = document.getElementById('apBtn'); btn.disabled = true;
  try { await api('POST', '/api/products', body); await refresh(); toast(`${body.name} added`); render(); }
  catch (e){ showServerError('addProductForm', e.message, err); btn.disabled = false; }
}

async function liveSignup(body, err){
  const btn = document.getElementById('signupBtn'); btn.disabled = true; btn.textContent = 'Creating account…';
  try {
    const r = await api('POST', '/auth/signup', body);
    S.signedUp = r.message; render(); window.scrollTo(0, 0);
  } catch (e){ showServerError('signupForm', e.message, err); btn.disabled = false; btn.textContent = 'Create account'; }
}

async function liveAction(a, o){
  const act = a.dataset.act;
  if (act === 'counter'){ S.counterOpen = !S.counterOpen; render(); return; }
  if (act === 'logout'){ const t = TOKEN; endSession('login');   // end it on the server too
    if (t) fetch('/auth/logout', {method:'POST', headers:{Authorization:'Bearer ' + t}}).catch(() => {}); return; }
  a.disabled = true;
  try {
    let msg = '';
    if (act === 'simulate'){
      const r = await api('POST', '/api/demo/simulate-order');
      S.selected = r.code; S.view = 'orders'; msg = `New order ${r.code} from ${r.retailer_name}`;
    } else if (act === 'approve'){
      await api('POST', `/api/orders/${o.id}/approve`); msg = `${o.id} approved. Retailer notified.`;
    } else if (act === 'reject'){
      await api('POST', `/api/orders/${o.id}/reject`, {reason:''}); msg = `${o.id} rejected`;
    } else if (act === 'sendCounter'){
      const d = document.getElementById('cd').value, p = Math.round(+document.getElementById('cp').value);
      if (!d || !p || p < 1){ toast('Enter a date and a price first'); a.disabled = false; return; }
      await api('POST', `/api/orders/${o.id}/counter`, {due_date:d, price_per_pair:p}); msg = 'Counter-offer sent to the retailer';
    } else if (act === 'retailerAccept' || act === 'retailerDecline'){
      await api('POST', `/api/demo/orders/${o.id}/retailer-reply`, {accept:act === 'retailerAccept'});
      msg = act === 'retailerAccept' ? `${o.id} confirmed` : `${o.id} cancelled`;
    } else if (act === 'advance'){
      await api('POST', `/api/orders/${o.id}/advance`, {to:a.dataset.to}); msg = `${o.id}: ${statusLabel(a.dataset.to)}`;
    }
    S.counterOpen = false;
    await refresh();
    if (msg) toast(msg);
  } catch (e){ toast(e.message); }
  render();
}

async function liveChange(t){
  const v = Math.max(0, Math.round(+t.value || 0));
  try {
    if (t.dataset.stock){ const [p, s] = t.dataset.stock.split(':'); await api('PUT', '/api/stock', {product_code:p, size:+s, ready:v}); }
    else if (t.dataset.cap) await api('PATCH', '/api/products/' + t.dataset.cap, {pairs_per_day:Math.max(1, v)});
    else if (t.dataset.buffer) await api('PATCH', '/api/me', {buffer_days:v});
    else if (t.dataset.price) await api('PATCH', '/api/products/' + t.dataset.price, {price_per_pair:Math.max(1, v)});
    else return;
    await refresh(); toast('Saved');
  } catch (e){ toast(e.message); }
  render();
}

async function boot(){
  try {
    const r = await fetch('/health', {cache:'no-store'});
    const h = r.ok ? await r.json() : null;
    if (h && h.ok){
      LIVE = true;
      if (h.today) TODAY = new Date(h.today + 'T09:00:00');
      document.querySelector('.demo-strip').style.display = 'none';   // live site: no prototype banner
      await loadPublic();
    }
  } catch (e) {}
  if (LIVE){
    TOKEN = loadToken();
    if (TOKEN){ try { await refresh(); saveToken(TOKEN); S.loggedIn = true; } catch (e) { TOKEN = null; saveToken(null); } }
  }
  render();
}

/* ---------- router ---------- */
function render(){
  let route = location.hash.replace('#','') || 'home';
  if (!['home','about','contact','login','signup','dashboard'].includes(route)) route='home';
  if (route==='dashboard' && !S.loggedIn) route='login';
  if ((route==='login' || route==='signup') && S.loggedIn) route='dashboard';
  if (route!=='signup') S.signedUp = null;
  if (route!=='contact') S.contactSent = null;
  // Show the page we actually opened in the address bar (e.g. #login when the dashboard needs a login).
  if (location.hash.replace('#','') !== route) history.replaceState(null, '', '#' + route);
  renderNav(route);
  const app=document.getElementById('app');
  const prevScroll = route==='dashboard' ? window.scrollY : 0;
  app.innerHTML = ({home,about,contact,login,signup,dashboard})[route]();
  if (route==='dashboard') window.scrollTo(0,prevScroll);
}
window.addEventListener('hashchange', ()=>{ render(); window.scrollTo(0,0); });
render();
boot();
</script>
