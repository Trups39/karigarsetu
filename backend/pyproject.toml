# Code style for the backend.   Check:  ruff check .    Format:  ruff format .
[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]   # errors, unused/missing names, import order, common bugs
ignore = ["B008"]                            # FastAPI's Depends(...) in arguments is intended

[tool.ruff.lint.isort]
known-first-party = ["app"]
