# Runs the tests on every push and pull request. A red ✗ on GitHub means something broke.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:          # "Run workflow" button in the Actions tab

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:               # a real PostgreSQL for the second test run
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: karigarsetu_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: No secrets committed
        run: |
          if [ -f .env ]; then echo "backend/.env must not be in the repo"; exit 1; fi
          if git grep -nE "sk-ant-api[0-9A-Za-z_-]{10,}|EAA[A-Za-z0-9]{40,}" -- . ':!*.md'; then
            echo "Something that looks like a real API key is in the code"; exit 1; fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install
        run: python -m pip install -r requirements.txt

      - name: Unit tests (SQLite)
        run: python -m pytest -q

      - name: Unit tests (PostgreSQL)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/karigarsetu_test
        run: python -m pytest -q
